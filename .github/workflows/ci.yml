name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated pages
        run: npm run build

      - name: Ensure generated pages are committed
        run: git diff --exit-code -- public/*.html

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests (server, contact API, pages and links)
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate
