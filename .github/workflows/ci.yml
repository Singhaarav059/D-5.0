name: CI

on:
  push:
    branches: [main, new]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated pages
        run: npm run build

      - name: Ensure generated pages are committed
        run: git diff --exit-code -- site/*.html

      - name: Run tests
        run: npm test

      - name: Run HTML and SEO checks
        run: npm run test:html

      - name: Check JavaScript syntax
        run: node --check static-server.js && node --check contact-api.js && node --check server.js && node --check site/serve.js && node --check site/build.js && node --check site/assets/site.js

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate
